[package]
name = "whypkg"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "wonder why the f* you have that package? know it now - a fast, cross-distro package investigator (apt, pacman, dnf, flatpak)"
authors = ["Pablo Antonio Hernández Hernández (safteinzz)"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://gitlab.com/safteinzz/whypkg"
keywords = ["apt", "pacman", "dnf", "flatpak", "packages"]
categories = ["command-line-utilities"]
# README screenshots are fetched over the network by crates.io via absolute raw
# URLs, never read out of the package, so shipping them would only bloat every download.
exclude = ["legacy/", "readme-assets/"]

[[bin]]
name = "whypkg"
path = "src/main.rs"

[dependencies]
clap           = { version = "4", features = ["derive"] } # CLI argument parsing
colored        = "2"                                       # terminal colors for the report mode
ratatui        = "0.29"                                    # the interactive TUI (browse mode)
crossterm      = "0.28"                                    # terminal backend / key events for ratatui
nucleo-matcher = "0.3"                                     # the fuzzy matcher behind the finder (no external fzf)
chrono         = "0.4"                                     # parse package-manager log timestamps for "same session"
flate2         = "1"                                       # read rotated, gzipped logs (e.g. dpkg.log.2.gz)

[target.'cfg(unix)'.dependencies]
libc = "0.2"                                               # restore default SIGPIPE so `whypkg … | head` exits quietly

[profile.release]
lto = true
strip = true
